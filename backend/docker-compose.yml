version: "3.9"

# Local dev only. Production uses managed services (Atlas, ElastiCache, MSK, EC2 coturn) —
# see docs/setup/backend-setup.md.

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  coturn:
    image: coturn/coturn:latest
    network_mode: host
    command: ["-n", "--log-file=stdout", "--realm=darkline.local"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    ports:
      - "4000:4000"
    depends_on: [mongo, redis]

  ws-signaling:
    build:
      context: .
      dockerfile: apps/ws-signaling/Dockerfile
    env_file: .env
    ports:
      - "4001:4001"
    depends_on: [redis]

  notification-worker:
    build:
      context: .
      dockerfile: apps/notification-worker/Dockerfile
    env_file: .env
    depends_on: [kafka, redis]

  fanout-worker:
    build:
      context: .
      dockerfile: apps/fanout-worker/Dockerfile
    env_file: .env
    depends_on: [kafka, redis]

volumes:
  mongo-data:
